name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # for the rolling release on main
    env:
      VERSION: 0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller pillow

      - name: Run smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_smoke.py

      - name: Convert icon
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          python -c "from PIL import Image; Image.open('icons/draw.png').save('build/draw.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --windowed --name SkitchG --icon build/draw.ico --add-data "icons;icons" app.py

      - name: Build installer
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc "/DAppVersion=$env:VERSION" packaging\windows\skitchg.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist\SkitchG -DestinationPath dist-installer\SkitchG-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SkitchG-Windows
          path: |
            dist-installer/SkitchG-Setup.exe
            dist-installer/SkitchG-portable.zip

      - name: Publish rolling pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-latest -y --cleanup-tag
          $global:LASTEXITCODE = 0   # no previous release is fine
          gh release create windows-latest --prerelease `
            --title "SkitchG for Windows (latest build)" `
            --notes "Automated build $env:VERSION of commit ${{ github.sha }}." `
            dist-installer/SkitchG-Setup.exe dist-installer/SkitchG-portable.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
